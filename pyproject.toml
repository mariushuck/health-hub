[project]
name = "health-hub"
version = "0.1.0"
description = "Garmin- und Withings-Daten in SQLite, je Person eine Instanz"
requires-python = "==3.13.*"
dependencies = [
    "garmin-connect-personal-api-python>=1,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
